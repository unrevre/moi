# settings
set -s default-terminal "tmux-256color"
set -s escape-time 10

set -g history-limit 1024

set -g prefix `
bind ` send-prefix

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
unbind 0

set -g automatic-rename off

set -g status-interval 15
set -g status-justify centre

set -g status-style 'fg=white,bg=black'
set -g status-left-length 50
set -g status-left '[#(~/.config/screen/stat-mem)#(~/.config/screen/stat-cpu)]'
set -g status-right-length 60
set -g status-right '[#h (#{session_name})][%m/%d %l:%M%p]'

set -g window-status-style 'fg=white,bg=black'
set -g window-status-format '[#{p-2:window_index}#{=1:#{p-1:window_flags}} #{=/9/...:window_name} ]'
set -g window-status-current-style 'fg=black,bg=red'
set -g window-status-current-format '[#{p-2:window_index}#{=1:#{p-1:window_flags}} #{=/9/...:window_name} ]'

# key bindings
bind Q kill-window

bind w choose-tree -Zw

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind v split-window -h
bind x split-window -v

bind , previous-window
bind . next-window

bind t command-prompt -p 'window name:' 'rename-window "%%"'

bind -n PageUp   copy-mode -u
bind -n PageDown copy-mode \; send-keys -X page-down

bind -T copy-mode    PageUp   send-keys -X page-up
bind -T copy-mode    PageDown send-keys -X page-down
bind -T copy-mode-vi PageUp   send-keys -X page-up
bind -T copy-mode-vi PageDown send-keys -X page-down
